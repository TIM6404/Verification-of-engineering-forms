<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>工程流程檢核表單管理系統</title>
  <!-- html2canvas & jsPDF CDN for JPG / PDF Export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #e6e9ef;
      --surface: #e6e9ef;
      --shadow-light: #ffffff;
      --shadow-dark: #c2c8d4;
      --text-main: #1e293b;
      --text-sub: #475569;
      --accent: #3b82f6;
      --accent-dark: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --line-green: #06c755;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.55;
      font-size: 16px;
    }

    /* Neumorphism Core Utilities */
    .neu-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      padding: 22px;
      margin-bottom: 22px;
    }

    .neu-card-sm {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .neu-inset {
      background: var(--surface);
      border-radius: var(--radius-sm);
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      border: none;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 15.5px;
      outline: none;
      width: 100%;
      transition: all 0.2s ease;
    }

    .neu-inset:focus {
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light), 0 0 0 2px rgba(59, 130, 246, 0.35);
    }

    .neu-btn {
      background: var(--surface);
      border: none;
      border-radius: var(--radius-sm);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      color: var(--text-main);
      font-weight: 700;
      font-size: 15px;
      padding: 11px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .neu-btn:active, .neu-btn.active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    .neu-btn-primary {
      color: #ffffff;
      background: linear-gradient(145deg, #428bff, #3174e0);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
    }
    .neu-btn-primary:active {
      background: #2563eb;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.25);
    }

    .neu-btn-success {
      color: #ffffff;
      background: linear-gradient(145deg, #12c98c, #0ea371);
    }
    .neu-btn-line {
      color: #ffffff;
      background: linear-gradient(145deg, #07d95c, #05b34c);
    }
    .neu-btn-danger {
      color: var(--danger);
    }

    /* Layout Container */
    .app-container {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 18px 96px 18px;
    }

    /* Top Header */
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-pill {
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
      color: var(--accent-dark);
      font-weight: 700;
    }

    /* Grid Helpers */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 680px) {
      .grid-3, .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* Project Card */
    .project-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s ease;
    }
    .project-meta h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: var(--text-main);
    }
    .project-meta p {
      margin: 0;
      font-size: 14.5px;
      color: var(--text-sub);
    }
    .project-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Sheet Tabs Grid - 放大字體更清晰易點選 */
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .sheet-tab {
      padding: 15px 14px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      letter-spacing: 0.3px;
    }
    .sheet-tab.active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      color: var(--accent-dark);
    }
    .sheet-tab .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Checklist & Radio Buttons - 2. 項目文字變大易辨識 */
    .check-row {
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      margin-bottom: 14px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .check-row-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .check-title {
      font-weight: 700;
      font-size: 17px;
      line-height: 1.5;
      color: #0f172a;
      flex: 1;
      min-width: 220px;
    }
    .check-subtext {
      font-size: 14.5px;
      color: var(--text-sub);
      line-height: 1.45;
    }
    .check-hint {
      font-size: 14px;
      color: var(--warning);
      font-weight: 700;
      margin-top: 4px;
    }
    .toggle-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .neu-radio {
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .neu-radio.selected-ok {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      color: var(--success);
    }
    .neu-radio.selected-ng {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      color: var(--danger);
    }
    .neu-radio.selected-na {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      color: var(--text-sub);
    }

    /* Survey multi-checkbox chips */
    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 6px;
    }
    .neu-chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .neu-chip.checked {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      color: var(--accent-dark);
      font-weight: 800;
    }

    /* Photo Attachment Area */
    .photo-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: var(--radius-md);
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .photo-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .photo-thumb {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      aspect-ratio: 4/3;
      background: #cbd5e1;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-del-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Section Header Banner */
    .section-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      margin: 20px 0 12px 0;
      font-weight: 800;
      font-size: 17.5px;
      color: var(--accent-dark);
      break-after: avoid;
      page-break-after: avoid;
    }

    .sub-cat-header {
      font-weight: 800;
      font-size: 16px;
      color: var(--text-main);
      margin: 14px 0 8px 4px;
      break-after: avoid;
      page-break-after: avoid;
    }

    /* Fixed Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(230, 233, 239, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 -4px 12px rgba(194, 200, 212, 0.7);
      padding: 10px 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 100;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 55, 72, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 10px 10px 24px rgba(0,0,0,0.25);
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--text-main);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      z-index: 300;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden { display: none !important; }
    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    /* A4 列印/匯出最佳化樣式 */
    .a4-exporting {
      width: 794px !important;
      max-width: 794px !important;
      background: #ffffff !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 24px 28px !important;
    }
    .a4-exporting .check-row,
    .a4-exporting .section-banner,
    .a4-exporting .photo-box,
    .a4-exporting .neu-inset,
    .a4-exporting .neu-radio,
    .a4-exporting .neu-chip {
      box-shadow: none !important;
      border: 1px solid #cbd5e1 !important;
      background: #ffffff !important;
    }
    .a4-exporting .neu-radio.selected-ok {
      background: #ecfdf5 !important;
      border-color: #059669 !important;
    }
    .a4-exporting .neu-radio.selected-ng {
      background: #fef2f2 !important;
      border-color: #dc2626 !important;
    }
    .a4-exporting .neu-chip.checked {
      background: #eff6ff !important;
      border-color: #2563eb !important;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div>
      <h1 class="app-title">🏗️ 工程流程檢核表單管理系統 <span class="badge-pill">Neumorphism 響應式版</span></h1>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <button type="button" class="neu-btn" id="btnSoundToggle" onclick="toggleClickSound()" title="切換清脆點擊音效">🔊 音效：開</button>
      <button type="button" class="neu-btn" id="btnBackHome" onclick="goHome()" style="display:none;">⬅ 返回專案列表</button>
    </div>
  </header>

  <!-- VIEW 1: 專案建立與列表 -->
  <section id="viewHome">
    <div class="neu-card">
      <h2 style="margin-top:0; font-size:18.5px;">➕ 建立新專案項目</h2>
      <div class="grid-3">
        <div>
          <label class="field-label">店編 *</label>
          <input type="text" id="inpStoreCode" class="neu-inset" placeholder="例：A1024" />
        </div>
        <div>
          <label class="field-label">店名 *</label>
          <input type="text" id="inpStoreName" class="neu-inset" placeholder="例：台北忠孝店" />
        </div>
        <div>
          <label class="field-label">地址 *</label>
          <input type="text" id="inpStoreAddr" class="neu-inset" placeholder="例：台北市大安區忠孝東路..." />
        </div>
      </div>
      <div style="margin-top:16px; display:flex; justify-content:flex-end;">
        <button type="button" id="btnAddProject" class="neu-btn neu-btn-primary" onclick="addProject()">＋ 新增專案項目</button>
      </div>
    </div>

    <div class="neu-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0; font-size:18.5px;">📋 專案清單（可隨時修改並自動更新修改日期）</h2>
        <span id="projectCountBadge" class="badge-pill">0 筆專案</span>
      </div>
      <div id="projectListContainer"></div>
    </div>
  </section>

  <!-- VIEW 2: 專案工作表選擇與表單填寫 -->
  <section id="viewWorkspace" class="hidden">
    <div class="neu-card" id="projectHeaderCard">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
        <span class="badge-pill">當前專案資訊（修改欄位將自動更新表單日期）</span>
        <span style="font-size:14.5px; font-weight:700; color:var(--accent-dark);">
          🗓️ 表單自動修改日期：<span id="displayAutoDate">-</span>
        </span>
      </div>
      <div class="grid-3">
        <div>
          <label class="field-label">店編</label>
          <input type="text" id="editStoreCode" class="neu-inset" oninput="updateCurrentProjectMeta()" />
        </div>
        <div>
          <label class="field-label">店名</label>
          <input type="text" id="editStoreName" class="neu-inset" oninput="updateCurrentProjectMeta()" />
        </div>
        <div>
          <label class="field-label">地址</label>
          <input type="text" id="editStoreAddr" class="neu-inset" oninput="updateCurrentProjectMeta()" />
        </div>
      </div>
    </div>

    <!-- 9大 SHEET 選擇項目 -->
    <div class="neu-card" style="padding:18px;">
      <label class="field-label" style="margin-bottom:12px; font-size:15.5px; color:var(--text-main);">
        📑 依據附件「SHEET」名稱選擇檢核項目：
      </label>
      <div class="sheet-grid" id="sheetTabsContainer"></div>
    </div>

    <!-- 匯出與檢核表單本體區域 -->
    <div id="exportCaptureArea" class="neu-card">
      <div id="exportSheetHeader" style="border-bottom:2px solid #cbd5e1; padding-bottom:12px; margin-bottom:16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <div>
          <h2 id="activeSheetTitle" style="margin:0; font-size:21px; color:var(--accent-dark);">表單標題</h2>
          <div id="exportMetaLine" style="font-size:14.5px; color:var(--text-sub); margin-top:4px; font-weight:600;"></div>
        </div>
        <div style="text-align:right; font-size:14.5px;">
          <div><strong>自動修改日期：</strong><span id="exportDateBadge"></span></div>
          <div id="exportProgressBadge" style="color:var(--success); font-weight:700; margin-top:2px;"></div>
        </div>
      </div>

      <div id="dynamicFormBody"></div>

      <!-- 分項拍照與文字補充區塊 -->
      <div class="photo-box" id="exportPhotoSection">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <strong style="font-size:16.5px;">📷 本分項表單「現場拍照」與「文字補充」</strong>
          <div class="no-export-btns">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple class="hidden" onchange="handlePhotoUpload(event)" />
            <input type="file" id="galleryInput" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" />
            <button type="button" class="neu-btn neu-btn-primary" onclick="document.getElementById('cameraInput').click()">📸 立即拍照</button>
            <button type="button" class="neu-btn" onclick="document.getElementById('galleryInput').click()">🖼️ 從相簿選取</button>
          </div>
        </div>
        <div id="photoPreviewGrid" class="photo-preview-grid"></div>
        <div style="margin-top:12px;">
          <label class="field-label">📝 分項表單文字補充說明：</label>
          <textarea id="sheetSupplementNote" rows="3" class="neu-inset" placeholder="請輸入本分項表單之補充說明、異常追蹤或現場備註..." oninput="saveSheetSupplementNote()"></textarea>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Fixed Bottom Action Bar -->
<div class="bottom-bar hidden" id="workspaceBottomBar">
  <button type="button" class="neu-btn neu-btn-success" onclick="confirmAndExportAll()">✅ 確認完成（A4分頁輕量 *.JPG / *.PDF + 相簿儲存）</button>
  <button type="button" class="neu-btn neu-btn-line" onclick="shareViaLine()">💬 LINE 傳送分享</button>
</div>

<!-- Modal: Confirm Output & Download / Album Save -->
<div class="modal-backdrop" id="exportResultModal">
  <div class="modal-card">
    <h3 style="margin-top:0; color:var(--success); font-size:19px;">✅ 表單已確認並完成 A4 輕量化分頁匯出！</h3>
    <p id="exportFileStatsText" style="font-size:14.5px; color:var(--text-sub); margin-bottom:14px;">
      已產生低容量、高清晰度 <strong>A4 規格 *.JPG</strong> 與 <strong>A4 自動分頁 *.PDF</strong> 檢核表單檔案。請點擊下方按鈕將資料存入使用者相簿或透過 LINE 傳送：
    </p>
    <div id="generatedPreviewWrap" style="margin-bottom:14px; text-align:center;">
      <img id="generatedJpgPreview" src="" alt="A4表單預覽" style="max-width:100%; max-height:240px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.15);" />
    </div>
    <div class="grid-2" style="margin-bottom:12px;">
      <button type="button" class="neu-btn neu-btn-primary" onclick="downloadGeneratedJpg()">📥 儲存 A4 *.JPG（存入相簿）</button>
      <button type="button" class="neu-btn neu-btn-primary" onclick="downloadGeneratedPdf()">📄 儲存 A4分頁 *.PDF</button>
    </div>
    <div style="display:flex; gap:10px; justify-content:space-between;">
      <button type="button" class="neu-btn neu-btn-line" style="flex:1;" onclick="shareViaLine()">💬 立即以 LINE 傳送</button>

// 3. 清脆點擊音效引擎 (Web Audio API 零外部音檔依賴)
// ==========================================
let soundEnabled = true;
let sharedAudioCtx = null;

function playCrispClick(type = 'tap') {
  if (!soundEnabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!sharedAudioCtx) {
      sharedAudioCtx = new AudioCtx();
    }
    if (sharedAudioCtx.state === 'suspended') {
      sharedAudioCtx.resume();
    }

    const now = sharedAudioCtx.currentTime;
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();

    if (type === 'confirm') {
      // 清脆雙音確認提示音
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1046.5, now); // C6
      osc.frequency.setValueAtTime(1318.5, now + 0.055); // E6
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(sharedAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    } else if (type === 'toggle') {
      // 清脆機械按鍵滴答聲
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1450, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.032);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
      osc.connect(gain);
      gain.connect(sharedAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.036);
    } else {
      // 一般輕快點擊聲
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.028);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc.connect(gain);
      gain.connect(sharedAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.032);
    }
  } catch (e) {
    // 忽略瀏覽器音效限制
  }
}

function toggleClickSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btnSoundToggle');
  if (btn) {
    btn.textContent = soundEnabled ? '🔊 音效：開' : '🔇 音效：關';
  }
  if (soundEnabled) playCrispClick('confirm');
}

// 全域點擊偵測：點擊任何按鈕、分頁、勾選框、晶片皆觸發清脆點擊音
document.addEventListener('pointerdown', function(e) {
  const target = e.target.closest('button, .sheet-tab, .neu-radio, .neu-chip');
  if (!target) return;
  if (target.id === 'btnSoundToggle') return;
  if (target.classList.contains('neu-btn-success')) {
    playCrispClick('confirm');
  } else if (target.classList.contains('neu-radio') || target.classList.contains('neu-chip')) {
    playCrispClick('toggle');
  } else {
    playCrispClick('tap');
  }
}, { passive: true });

let memoryProjectsFallback = [];
let memoryAuditFallback = [];

function safeLoadStorage(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSaveStorage(key, val) {
  try {
    window.localStorage.setItem(key, JSON.stringify(val));
    return true;
  } catch (e) {
    return false;
  }
}

function getFormattedNow() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

  if (INTERNAL_GOOGLE_FORM_ENDPOINT && INTERNAL_GOOGLE_FORM_ENDPOINT.startsWith('http')) {
    try {
      const formData = new URLSearchParams();
      formData.append('time', nowStr);
      formData.append('action', actionType);
      formData.append('code', logEntry.code);
      formData.append('name', logEntry.name);
      formData.append('addr', logEntry.addr);
      formData.append('sheet', logEntry.sheet);
      formData.append('summary', summaryText);
      fetch(INTERNAL_GOOGLE_FORM_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      }).catch(() => {});
    } catch (err) {}
  }
}

// 1. 專案新增、刪除與列表渲染
function addProject() {
  const codeEl = document.getElementById('inpStoreCode');
  const nameEl = document.getElementById('inpStoreName');
  const addrEl = document.getElementById('inpStoreAddr');

  const code = codeEl ? codeEl.value.trim() : '';
  const name = nameEl ? nameEl.value.trim() : '';
  const addr = addrEl ? addrEl.value.trim() : '';

  if (!code || !name || !addr) {
    showToast('⚠️ 請完整填寫「店編」、「店名」與「地址」');
    if (!code && codeEl) codeEl.focus();
    else if (!name && nameEl) nameEl.focus();
    else if (!addr && addrEl) addrEl.focus();
    return;
  }

  const nowStr = getFormattedNow();
  const newProj = {
    id: 'PRJ_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    code,
    name,
    addr,
    updatedAt: nowStr,
    sheetsData: {}
  };

  if (!Array.isArray(projects)) projects = [];
  projects.unshift(newProj);
  saveProjectsToStorage();

  codeEl.value = '';
  nameEl.value = '';
  addrEl.value = '';

  recordSystemUsage('建立專案', newProj, '全部表單', `新增專案 ${code} ${name}`);
  renderProjectList();
  showToast(`✅ 已成功建立專案：${code} ${name}`);
}

function deleteProject(id, event) {
  if (event) event.stopPropagation();
  const target = projects.find(p => p.id === id);
  if (!target) return;
  if (!confirm(`確定要刪除專案「${target.code} - ${target.name}」嗎？此操作無法復原。`)) return;

  projects = projects.filter(p => p.id !== id);
  saveProjectsToStorage();
  recordSystemUsage('刪除專案', target, '全部表單', `刪除專案 ${target.code} ${target.name}`);
  renderProjectList();
  showToast('🗑️ 已刪除專案項目');
}

function renderProjectList() {
  const container = document.getElementById('projectListContainer');
  const countBadge = document.getElementById('projectCountBadge');
  if (!container) return;
  if (countBadge) countBadge.textContent = `${projects.length} 筆專案`;

  if (projects.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:26px; color:var(--text-sub); font-size:15.5px;">尚無專案資料，請於上方輸入店編、店名、地址建立第一筆專案。</div>`;
    return;
  }

  container.innerHTML = projects.map(p => {
    const filledSheets = Object.keys(p.sheetsData || {}).length;
    return `
      <div class="neu-card-sm project-item">
        <div class="project-meta">
          <h3>🏪 [${escapeHtml(p.code)}] ${escapeHtml(p.name)}</h3>
          <p>📍 地址：${escapeHtml(p.addr)}</p>
          <p style="margin-top:4px; color:var(--accent-dark); font-weight:700;">
            🗓️ 修改日期：${escapeHtml(p.updatedAt)} ｜ 已填寫分項：${filledSheets} / ${SHEET_NAMES.length}
          </p>
        </div>
        <div class="project-actions">
          <button type="button" class="neu-btn neu-btn-primary" onclick="openProject('${p.id}')">✏️ 進入檢核 / 修改</button>
          <button type="button" class="neu-btn neu-btn-danger" onclick="deleteProject('${p.id}', event)">🗑️ 刪除</button>
        </div>
      </div>
    `;
  }).join('');
}

function openProject(id) {
  const proj = projects.find(p => p.id === id);
  if (!proj) return;
  currentProjectId = id;
  currentSheetName = SHEET_NAMES[0];

  document.getElementById('editStoreCode').value = proj.code;
  document.getElementById('editStoreName').value = proj.name;
  document.getElementById('editStoreAddr').value = proj.addr;
  document.getElementById('displayAutoDate').textContent = proj.updatedAt;

  document.getElementById('viewHome').classList.add('hidden');
  document.getElementById('viewWorkspace').classList.remove('hidden');
  document.getElementById('btnBackHome').style.display = 'inline-flex';
  document.getElementById('workspaceBottomBar').classList.remove('hidden');

  recordSystemUsage('進入專案檢核', proj, currentSheetName, '開啟專案作業畫面');
  renderSheetTabs();
  renderCurrentSheetForm();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  currentProjectId = null;
  document.getElementById('viewWorkspace').classList.add('hidden');
  document.getElementById('workspaceBottomBar').classList.add('hidden');
  document.getElementById('btnBackHome').style.display = 'none';
  document.getElementById('viewHome').classList.remove('hidden');
  renderProjectList();
}

function updateCurrentProjectMeta() {
  const proj = getCurrentProject();
  if (!proj) return;
  proj.code = document.getElementById('editStoreCode').value.trim();
  proj.name = document.getElementById('editStoreName').value.trim();
  proj.addr = document.getElementById('editStoreAddr').value.trim();
  touchProjectModifiedDate(proj);
  updateExportHeaderMeta();
}

function touchProjectModifiedDate(proj) {
  const nowStr = getFormattedNow();
  proj.updatedAt = nowStr;
  const d1 = document.getElementById('displayAutoDate');
  const d2 = document.getElementById('exportDateBadge');
  if (d1) d1.textContent = nowStr;
  if (d2) d2.textContent = nowStr;
  saveProjectsToStorage();
}

function getCurrentProject() {
  return projects.find(p => p.id === currentProjectId);
}

function getSheetState(proj, sheetName) {
  if (!proj.sheetsData) proj.sheetsData = {};
  if (!proj.sheetsData[sheetName]) {
    proj.sheetsData[sheetName] = {
      answers: {},
      inputs: {},
      photos: [],
      supplementNote: ''
    };
  }
  return proj.sheetsData[sheetName];
}

// 2. 渲染 9 大 SHEET 選擇分頁
function renderSheetTabs() {
  const proj = getCurrentProject();
  if (!proj) return;
  const container = document.getElementById('sheetTabsContainer');
  container.innerHTML = SHEET_NAMES.map(name => {
    const sData = proj.sheetsData && proj.sheetsData[name];
    const hasContent = sData && (Object.keys(sData.answers || {}).length > 0 || Object.keys(sData.inputs || {}).length > 0 || (sData.photos || []).length > 0);
    const activeCls = name === currentSheetName ? 'active' : '';
    return `
      <div class="sheet-tab ${activeCls}" onclick="selectSheet('${name}')">
        ${escapeHtml(name)}${hasContent ? '<span class="dot" title="已有填寫資料"></span>' : ''}
      </div>
    `;
  }).join('');
}

function selectSheet(name) {
  currentSheetName = name;
  renderSheetTabs();
  renderCurrentSheetForm();
}

function updateExportHeaderMeta() {
  const proj = getCurrentProject();
  if (!proj) return;
  document.getElementById('activeSheetTitle').textContent = `【${currentSheetName}】檢核表單`;
  document.getElementById('exportMetaLine').textContent = `店編：${proj.code} ｜ 店名：${proj.name} ｜ 地址：${proj.addr}`;
  document.getElementById('exportDateBadge').textContent = proj.updatedAt;
}

// 3. 動態渲染各 SHEET 表單內容
function renderCurrentSheetForm() {
  const proj = getCurrentProject();
  if (!proj) return;
  const schema = FORMS_SCHEMA[currentSheetName];
  const state = getSheetState(proj, currentSheetName);

  updateExportHeaderMeta();
  document.getElementById('sheetSupplementNote').value = state.supplementNote || '';
  renderPhotoGrid(state);

  const body = document.getElementById('dynamicFormBody');
  let html = '';
  let totalCheckCount = 0;
  let checkedCount = 0;

  if (schema.type === 'acceptance') {
    schema.groups.forEach((grp, gIdx) => {
      html += `<div class="section-banner">● ${escapeHtml(grp.group)}</div>`;
      grp.items.forEach((item, iIdx) => {
        const key = `g${gIdx}_i${iIdx}`;
        const val = state.answers[key] || '';
        const noteVal = state.inputs[key + '_note'] || '';
        totalCheckCount++;
        if (val) checkedCount++;

        html += `
          <div class="check-row">
            <div class="check-row-header">
              <div class="check-title">
                ${escapeHtml(item.text)}
                ${item.hint ? `<div class="check-hint">💡 查核標準/備註：${escapeHtml(item.hint)}</div>` : ''}
              </div>
              <div class="toggle-group">
                <span class="neu-radio ${val === item.ok_label ? 'selected-ok' : ''}" onclick="setAnswer('${key}', '${item.ok_label}')">☑ ${escapeHtml(item.ok_label)}</span>
                <span class="neu-radio ${val === item.ng_label ? 'selected-ng' : ''}" onclick="setAnswer('${key}', '${item.ng_label}')">⚠ ${escapeHtml(item.ng_label)}</span>
                <span class="neu-radio ${val === '無此項' ? 'selected-na' : ''}" onclick="setAnswer('${key}', '無此項')">➖ 無此項</span>
              </div>
            </div>
            <div>
              <input type="text" class="neu-inset" placeholder="異常備註與處理說明 / 實測數值填寫..." value="${escapeAttr(noteVal)}" oninput="setInput('${key}_note', this.value)" />
            </div>
          </div>
        `;
      });
    });
  } else if (schema.type === 'inspection') {
    schema.stages.forEach((stg, sIdx) => {
      const stageDateKey = `stage_date_${sIdx}`;
      const stageDateVal = state.inputs[stageDateKey] || '';
      html += `
        <div class="section-banner" style="flex-wrap:wrap; gap:10px;">
          <span>🔍 ${escapeHtml(stg.stage)}</span>
          <div style="display:flex; align-items:center; gap:6px; font-size:15px;">
            <span>檢查日期：</span>
            <input type="date" class="neu-inset" style="width:auto; padding:6px 10px;" value="${escapeAttr(stageDateVal)}" oninput="setInput('${stageDateKey}', this.value)" />
          </div>
        </div>
      `;
      stg.categories.forEach((cat, cIdx) => {
        html += `<div class="sub-cat-header">▸ ${escapeHtml(cat.category)} ${cat.note ? `<span style="color:var(--danger); font-size:14px;">(${escapeHtml(cat.note)})</span>` : ''}</div>`;
        cat.items.forEach((item, iIdx) => {
          const key = `s${sIdx}_c${cIdx}_i${iIdx}`;
          const val = state.answers[key] || '';
          const noteVal = state.inputs[key + '_note'] || '';
          totalCheckCount++;
          if (val || (item.is_bag_count && noteVal)) checkedCount++;

          if (item.is_bag_count) {
            html += `
              <div class="check-row">
                <div class="check-row-header">
                  <div class="check-title">${escapeHtml(item.text)}</div>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <input type="text" class="neu-inset" style="width:160px;" placeholder="輸入種類與袋數" value="${escapeAttr(noteVal)}" oninput="setInput('${key}_note', this.value)" />
                    <span style="font-weight:700;">袋</span>
                  </div>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="check-row">
                <div class="check-row-header">
                  <div class="check-title">${escapeHtml(item.text)}</div>
                  <div class="toggle-group">
                    <span class="neu-radio ${val === item.yes_label ? 'selected-ok' : ''}" onclick="setAnswer('${key}', '${item.yes_label}')">☑ ${escapeHtml(item.yes_label)}</span>
                    <span class="neu-radio ${val === item.no_label ? 'selected-ng' : ''}" onclick="setAnswer('${key}', '${item.no_label}')">⚠ ${escapeHtml(item.no_label)}</span>
                    ${item.has_na ? `<span class="neu-radio ${val === '無此項' ? 'selected-na' : ''}" onclick="setAnswer('${key}', '無此項')">➖ 無此項</span>` : ''}
                  </div>
                </div>
                <input type="text" class="neu-inset" placeholder="異常回報及處理內容 / 備註..." value="${escapeAttr(noteVal)}" oninput="setInput('${key}_note', this.value)" />
              </div>
            `;
          }
        });
      });
    });
  } else if (schema.type === 'survey') {
    schema.sections.forEach((sec, sIdx) => {
      html += `<div class="section-banner">📐 ${escapeHtml(sec.section)}</div>`;
      sec.items.forEach((item, iIdx) => {
        const key = `sv_${sIdx}_${iIdx}`;
        const rawContent = item.content || '';
        const options = extractCheckboxOptions(rawContent);
        const selectedArr = Array.isArray(state.answers[key]) ? state.answers[key] : [];
        const textVal = state.inputs[key + '_val'] || '';
        const extraVal = state.inputs[key + '_extra'] || '';

        totalCheckCount++;
        if (selectedArr.length > 0 || textVal || extraVal) checkedCount++;

        html += `
          <div class="check-row">
            <div class="check-title">${escapeHtml(item.label)}</div>
            ${rawContent ? `<div class="check-subtext">${escapeHtml(rawContent)}</div>` : ''}
            ${options.length > 0 ? `
              <div class="chip-wrap">
                ${options.map(opt => {
                  const isChk = selectedArr.includes(opt);
                  return `<span class="neu-chip ${isChk ? 'checked' : ''}" onclick="toggleSurveyOption('${key}', '${escapeAttr(opt)}')">${isChk ? '☑' : '☐'} ${escapeHtml(opt)}</span>`;
                }).join('')}
              </div>
            ` : ''}
            <div class="${item.extra ? 'grid-2' : ''}" style="margin-top:4px;">
              <input type="text" class="neu-inset" placeholder="填寫數據、尺寸(cm/m²)、數量、型式或說明..." value="${escapeAttr(textVal)}" oninput="setInput('${key}_val', this.value)" />
              ${item.extra ? `<input type="text" class="neu-inset" placeholder="${escapeAttr(item.extra)}" value="${escapeAttr(extraVal)}" oninput="setInput('${key}_extra', this.value)" />` : ''}
            </div>
          </div>
        `;
      });
    });
  } else if (schema.type === 'change_order') {
    html += `<div class="section-banner">📝 A. 基本資訊</div><div class="grid-2">`;
    schema.basic_fields.forEach((f, idx) => {
      const key = `co_basic_${idx}`;
      const isDate = f.includes('日');
      const val = state.inputs[key] || (f === '店名' ? proj.name : '');
      totalCheckCount++;
      if (val) checkedCount++;
      html += `
        <div>
          <label class="field-label">${escapeHtml(f)}</label>
          <input type="${isDate ? 'date' : 'text'}" class="neu-inset" value="${escapeAttr(val)}" placeholder="請輸入${escapeAttr(f)}" oninput="setInput('${key}', this.value)" />
        </div>
      `;
    });
    html += `</div><div class="section-banner">🔄 B. 差異項目</div><div class="grid-3">`;
    schema.diff_fields.forEach((f, idx) => {
      const key = `co_diff_${idx}`;
      const val = state.inputs[key] || '';
      totalCheckCount++;
      if (val) checkedCount++;
      html += `
        <div>
          <label class="field-label">${escapeHtml(f)}</label>
          <input type="text" class="neu-inset" value="${escapeAttr(val)}" placeholder="請填寫${escapeAttr(f)}" oninput="setInput('${key}', this.value)" />
        </div>
      `;
    });
    html += `</div><div class="section-banner">📌 C ~ E. 變更原因與前後圖面差異說明</div>`;
    schema.reason_fields.forEach((f, idx) => {
      const key = `co_reason_${idx}`;
      const val = state.inputs[key] || '';
      totalCheckCount++;
      if (val) checkedCount++;
      html += `
        <div style="margin-bottom:12px;">
          <label class="field-label">${escapeHtml(f)}</label>
          <textarea rows="3" class="neu-inset" placeholder="請詳細填寫${escapeAttr(f)}..." oninput="setInput('${key}', this.value)">${escapeHtml(val)}</textarea>
        </div>
      `;
    });
  }

  body.innerHTML = html;
  document.getElementById('exportProgressBadge').textContent = `已填寫項目：${checkedCount} / ${totalCheckCount}`;
}

function extractCheckboxOptions(text) {
  if (!text || !text.includes('□')) return [];
  const parts = text.split('□').map(s => s.trim()).filter(Boolean);
  return parts.map(p => p.replace(/_{2,}/g, '').replace(/[：:]\s*$/, '').trim()).filter(p => p.length > 0 && p.length <= 28);
}

function setAnswer(key, value) {
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);
  state.answers[key] = (state.answers[key] === value) ? '' : value;
  touchProjectModifiedDate(proj);
  renderSheetTabs();
  renderCurrentSheetForm();
}

function toggleSurveyOption(key, opt) {
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);
  if (!Array.isArray(state.answers[key])) state.answers[key] = [];
  const idx = state.answers[key].indexOf(opt);
  if (idx >= 0) {
    state.answers[key].splice(idx, 1);
  } else {
    state.answers[key].push(opt);
  }
  touchProjectModifiedDate(proj);
  renderSheetTabs();
  renderCurrentSheetForm();
}

function setInput(key, value) {
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);
  state.inputs[key] = value;
  touchProjectModifiedDate(proj);
  renderSheetTabs();
}

function saveSheetSupplementNote() {
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);
  state.supplementNote = document.getElementById('sheetSupplementNote').value;
  touchProjectModifiedDate(proj);
}

// 4. 分項表單拍照與輕量化相片壓縮處理
function handlePhotoUpload(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const maxW = 720;
        let w = img.width;
        let h = img.height;
        if (w > maxW) {
          h = Math.round(h * (maxW / w));
          w = maxW;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.68);
        state.photos.push({
          id: 'PH_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          dataUrl: compressedDataUrl,
          time: getFormattedNow()
        });
        touchProjectModifiedDate(proj);
        renderPhotoGrid(state);
        renderSheetTabs();
        showToast('📸 已新增現場照片');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function deletePhoto(photoId) {
  const proj = getCurrentProject();
  if (!proj) return;
  const state = getSheetState(proj, currentSheetName);
  state.photos = state.photos.filter(ph => ph.id !== photoId);
  touchProjectModifiedDate(proj);
  renderPhotoGrid(state);
  renderSheetTabs();
}

function renderPhotoGrid(state) {
  const grid = document.getElementById('photoPreviewGrid');
  if (!state.photos || state.photos.length === 0) {
    grid.innerHTML = `<div style="font-size:14px; color:var(--text-sub); grid-column:1/-1;">尚未附加現場照片，可點擊右上方「立即拍照」或「從相簿選取」。</div>`;
    return;
  }
  grid.innerHTML = state.photos.map(ph => `
    <div class="photo-thumb">
      <img src="${ph.dataUrl}" alt="現場照片" />
      <button type="button" class="photo-del-btn" onclick="deletePhoto('${ph.id}')" title="移除照片">✕</button>
    </div>
  `).join('');
}

// ==========================================
// 1. 降低完成後產生的表單檔案大小 (*.JPG / *.PDF)，並以 A4 規格智慧分頁
// ==========================================
async function confirmAndExportAll() {
  const proj = getCurrentProject();
  if (!proj) return;

  touchProjectModifiedDate(proj);
  showToast('⏳ 正在產生 A4 輕量分頁 JPG 與 PDF，請稍候...');

  const captureEl = document.getElementById('exportCaptureArea');
  const btnsToHide = captureEl.querySelectorAll('.no-export-btns, .photo-del-btn');
  btnsToHide.forEach(b => b.style.visibility = 'hidden');
  captureEl.classList.add('a4-exporting');

  try {
    // 採 1.25x 倍率 + 白底扁平化樣式，大幅降低檔案容量並保持文字銳利
    const fullCanvas = await html2canvas(captureEl, {
      scale: 1.25,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    });

    captureEl.classList.remove('a4-exporting');
    btnsToHide.forEach(b => b.style.visibility = 'visible');

    // A4 比例 (210mm x 297mm -> 寬高比 1 : 1.4142)
    const a4Ratio = 297 / 210;
    const pagePixelWidth = fullCanvas.width;
    const pagePixelHeight = Math.floor(pagePixelWidth * a4Ratio);
    const totalPages = Math.max(1, Math.ceil(fullCanvas.height / pagePixelHeight));

    lastGeneratedJpgPages = [];
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'p',
      unit: 'mm',
      format: 'a4',
      compress: true
    });

    const pdfPageW = 210;
    const pdfPageH = 297;
    const margin = 8;
    const usableW = pdfPageW - margin * 2;
    const usableH = pdfPageH - margin * 2;

    let totalJpgBytes = 0;

    for (let p = 0; p < totalPages; p++) {
      const srcY = p * pagePixelHeight;
      const sliceH = Math.min(pagePixelHeight, fullCanvas.height - srcY);

      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = pagePixelWidth;
      pageCanvas.height = pagePixelHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      ctx.drawImage(
        fullCanvas,
        0, srcY, pagePixelWidth, sliceH,
        0, 0, pagePixelWidth, sliceH
      );

      // 加上 A4 頁碼標記
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`第 ${p + 1} 頁 / 共 ${totalPages} 頁（A4規格）`, pageCanvas.width - 20, pageCanvas.height - 14);

      // 0.62 JPEG 壓縮品質：大幅縮小檔案體積（單頁約 80KB~180KB），且文字清晰可辨
      const pageJpgDataUrl = pageCanvas.toDataURL('image/jpeg', 0.62);
      lastGeneratedJpgPages.push(pageJpgDataUrl);
      totalJpgBytes += Math.round((pageJpgDataUrl.length * 3) / 4);

      if (p > 0) pdf.addPage('a4', 'p');
      pdf.addImage(pageJpgDataUrl, 'JPEG', margin, margin, usableW, usableH, undefined, 'FAST');
    }

    const safeDate = proj.updatedAt.replace(/[:\s]/g, '-');
    lastGeneratedFileName = `${proj.code}_${proj.name}_${currentSheetName}_${safeDate}`;

    const pdfBlob = pdf.output('blob');
    if (lastGeneratedPdfBlobUrl) URL.revokeObjectURL(lastGeneratedPdfBlobUrl);
    lastGeneratedPdfBlobUrl = URL.createObjectURL(pdfBlob);

    const jpgKB = Math.max(1, Math.round(totalJpgBytes / 1024));
    const pdfKB = Math.max(1, Math.round(pdfBlob.size / 1024));

    const state = getSheetState(proj, currentSheetName);
    const ansCount = Object.keys(state.answers || {}).length;
    const photoCount = (state.photos || []).length;
    recordSystemUsage(
      '確認完成匯出',
      proj,
      currentSheetName,
      `A4共${totalPages}頁, JPG:${jpgKB}KB, PDF:${pdfKB}KB, 勾選:${ansCount}項, 照片:${photoCount}張`
    );

    document.getElementById('generatedJpgPreview').src = lastGeneratedJpgPages[0];
    document.getElementById('exportFileStatsText').innerHTML =
      `已產生 <strong>A4 規格共 ${totalPages} 頁</strong> 輕量檔案（JPG 總計約 <strong>${jpgKB} KB</strong> ｜ PDF 約 <strong>${pdfKB} KB</strong>），兼顧清晰度與快速傳送：`;

    document.getElementById('exportResultModal').classList.add('show');
    showToast(`✅ 已產生 A4 共 ${totalPages} 頁（PDF ${pdfKB}KB）`);
  } catch (err) {
    captureEl.classList.remove('a4-exporting');
    btnsToHide.forEach(b => b.style.visibility = 'visible');
    console.error(err);
    showToast('❌ 表單轉檔發生異常，請重試');
  }
}

async function downloadGeneratedJpg() {
  if (!lastGeneratedJpgPages || lastGeneratedJpgPages.length === 0) return;

  // 行動裝置支援 Web Share API 時，可一次將所有 A4 分頁 JPG 存入相簿
  try {
    const files = [];
    for (let i = 0; i < lastGeneratedJpgPages.length; i++) {
      const res = await fetch(lastGeneratedJpgPages[i]);
      const blob = await res.blob();
      const pageSuffix = lastGeneratedJpgPages.length > 1 ? `_P${i + 1}` : '';
      files.push(new File([blob], `${lastGeneratedFileName}${pageSuffix}.jpg`, { type: 'image/jpeg' }));
    }
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({
        files,
        title: lastGeneratedFileName,
        text: `工程流程檢核表單 A4 分頁圖檔（共 ${files.length} 頁，可選擇儲存影像存入相簿）`
      });
      return;
    }
  } catch (e) {}

  // PC 端逐頁下載輕量 A4 JPG
  lastGeneratedJpgPages.forEach((dataUrl, idx) => {
    const pageSuffix = lastGeneratedJpgPages.length > 1 ? `_P${idx + 1}` : '';
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${lastGeneratedFileName}${pageSuffix}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  showToast(`📥 已下載 ${lastGeneratedJpgPages.length} 張 A4 規格 JPG 檔案`);
}

function downloadGeneratedPdf() {
  if (!lastGeneratedPdfBlobUrl) return;
  const a = document.createElement('a');
  a.href = lastGeneratedPdfBlobUrl;
  a.download = `${lastGeneratedFileName}.pdf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('📄 已下載 A4 分頁輕量 PDF 檔案');
}

async function shareViaLine() {
  const proj = getCurrentProject();
  if (!proj) return;
  const shareText = `【工程流程檢核表單】\n店編：${proj.code}\n店名：${proj.name}\n地址：${proj.addr}\n項目：${currentSheetName}\n修改日期：${proj.updatedAt}`;

  if (lastGeneratedJpgPages && lastGeneratedJpgPages.length > 0) {
    try {
      const files = [];
      for (let i = 0; i < lastGeneratedJpgPages.length; i++) {
        const res = await fetch(lastGeneratedJpgPages[i]);
        const blob = await res.blob();
        const pageSuffix = lastGeneratedJpgPages.length > 1 ? `_P${i + 1}` : '';
        files.push(new File([blob], `${lastGeneratedFileName || '檢核表單'}${pageSuffix}.jpg`, { type: 'image/jpeg' }));
      }
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({
          files,
          title: `${proj.code} ${proj.name} - ${currentSheetName}`,
          text: shareText
        });
        return;
      }
    } catch (e) {}
  }

  const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`;
  window.open(lineUrl, '_blank');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(str) {
  return escapeHtml(str);
}

// 支援按 Enter 鍵直接建立專案
document.addEventListener('DOMContentLoaded', function() {
  ['inpStoreCode', 'inpStoreName', 'inpStoreAddr'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addProject();
        }
      });
    }
  });
  renderProjectList();
});

renderProjectList();
